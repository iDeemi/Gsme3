<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Parking Panic</title>
<style>
:root{--bg1:#2da6ff;--bg2:#8de1ff;--bg3:#ecf9ff;--ink:#17315e;--shadow:0 14px 34px rgba(19,42,84,.22);--soft:0 8px 18px rgba(19,42,84,.14);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2) 28%,var(--bg3) 75%,#fff);color:#17315e}
button{font:inherit;border:0;background:none;padding:0;cursor:pointer}
img{user-select:none;-webkit-user-drag:none}
.app{max-width:560px;height:100%;margin:0 auto;position:relative;overflow:hidden}
.bgCloud{position:absolute;opacity:.9;filter:blur(.1px);z-index:0}
.c1{top:95px;left:18px;width:90px} .c2{top:160px;right:24px;width:110px}
.top{position:relative;z-index:5;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:grid;grid-template-columns:72px 1fr 140px;gap:10px;align-items:start}
.btnMenu{width:72px} .btnGarage{width:132px}
.logoWrap{text-align:center} .logo{width:min(100%,330px);display:block;margin:0 auto}
.topRight{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.coinBox{display:flex;align-items:center;gap:6px;background:rgba(12,52,115,.86);border-radius:20px;padding:6px 8px 6px 6px;box-shadow:var(--shadow);backdrop-filter:blur(2px)}
.coinIcon{width:42px;display:block} .plusBtn{width:28px;display:block} .coins{color:#fff;font-size:20px;font-weight:900;min-width:56px;text-align:center}
.levelBanner{position:relative;z-index:4;width:min(86%,430px);margin:-10px auto 4px} .levelBanner img{width:100%;display:block}
.levelBanner .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:2px}
.levelBanner .lvl{font-size:clamp(23px,5vw,32px);font-weight:1000;color:#113d95;line-height:1; text-shadow:0 2px 0 rgba(255,255,255,.45)}
.levelBanner .sub{margin-top:14px;font-size:clamp(13px,3vw,18px);font-weight:900;color:#163d85;text-align:center}
.world{position:relative;z-index:3;width:min(98vw,525px);aspect-ratio:5/6.45;margin:0 auto}
.dec{position:absolute;z-index:1;display:block}
.shop{width:86px;left:4px;top:48px} .parkB{width:110px;right:6px;top:62px} .hotdog{width:76px;left:14px;bottom:160px} .fountain{width:92px;right:16px;bottom:144px}
.tree1{width:74px;left:88px;top:92px} .tree2{width:68px;right:84px;bottom:170px} .tree3{width:62px;right:12px;top:220px}
.bench{width:66px;left:10px;bottom:92px} .cone{width:34px;left:118px;bottom:108px} .hydrant{width:34px;left:176px;bottom:92px} .mailbox{width:36px;left:220px;bottom:94px} .lamp{width:30px;right:102px;bottom:86px}
.lotShell{position:absolute;left:70px;right:74px;top:112px;bottom:170px;border-radius:24px;background:linear-gradient(180deg,#aab0b5,#8a8f94);box-shadow:0 14px 26px rgba(0,0,0,.22);padding:12px;z-index:2}
.lot{position:relative;width:100%;height:100%;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02)),#4f545a;box-shadow:inset 0 10px 14px rgba(255,255,255,.04), inset 0 -12px 16px rgba(0,0,0,.12)}
.gridline{position:absolute;pointer-events:none;z-index:0} .gridline.v{top:0;bottom:0;width:2px;background:rgba(255,255,255,.18)} .gridline.h{left:0;right:0;height:2px;background:rgba(255,255,255,.14)}
.exitSign{position:absolute;right:-2px;top:260px;width:92px;z-index:3}
.bubbleTut{position:absolute;left:50%;top:126px;transform:translateX(-50%);width:210px;z-index:5}
.blockedPop{position:absolute;left:50%;top:18px;transform:translateX(-50%);width:170px;z-index:8;display:none}
.metrics{position:absolute;left:18px;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;z-index:3}
.metric{position:relative} .metric img{width:100%;display:block} .metric .num{position:absolute;left:0;right:0;bottom:26px;text-align:center;font-size:44px;font-weight:1000;line-height:1}
.metric.errors .num{color:#f23b34} .metric.left .num{color:#0d63ff} .metric.combo .num{color:#8d34ff}
.bottom{position:relative;z-index:4;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
.controls{display:grid;grid-template-columns:1fr 1fr 1.32fr;gap:8px;align-items:end}
.ctrl{position:relative} .ctrl img{width:100%;display:block} .hintBadge{position:absolute;right:0;top:-10px;width:44px}
.car{position:absolute;z-index:4;pointer-events:auto;transition:left .42s cubic-bezier(.2,.8,.2,1), top .42s cubic-bezier(.2,.8,.2,1), opacity .28s, transform .18s;filter:drop-shadow(0 7px 6px rgba(0,0,0,.30));}
.car img{width:100%;height:100%;object-fit:contain;display:block} .car.blocked{animation:bump .28s ease} .car.hint{animation:pulse 1s infinite}
@keyframes bump{0%,100%{transform:translate(0)}30%{transform:translate(-6px)}65%{transform:translate(6px)}} @keyframes pulse{50%{filter:drop-shadow(0 0 12px #fff48a) brightness(1.15);}}
.smoke{position:absolute;z-index:5;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.76);animation:smoke .72s ease-out forwards} @keyframes smoke{to{transform:translateY(-28px) scale(2.4);opacity:0}}
.coinPop{position:absolute;z-index:6;font-size:20px;font-weight:1000;color:#ffe46d;text-shadow:0 2px 3px rgba(0,0,0,.45);animation:coinpop .82s ease-out forwards} @keyframes coinpop{to{transform:translateY(-34px) scale(1.14);opacity:0}}
.overlay{position:absolute;inset:0;z-index:100;background:rgba(16,35,74,.50);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:.24s} .overlay.show{opacity:1;pointer-events:auto}
.panel{width:100%;max-width:420px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#fffefb,#f5f0e5);border-radius:28px;padding:18px 16px 16px;box-shadow:0 24px 70px rgba(0,0,0,.28);position:relative}
.close{position:absolute;right:12px;top:10px;font-size:30px;color:#3b74da;font-weight:900}
.winTop{text-align:center} .medal{width:132px;display:block;margin:0 auto 6px} .stars{font-size:38px;letter-spacing:2px} .starOff{opacity:.22;filter:grayscale(1)} .winText{font-weight:900;color:#315c8b;margin-top:8px}
.winBtns{margin-top:12px;display:grid;gap:10px} .bigSprite{position:relative} .bigSprite img{width:100%;display:block} .btnLabel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;color:#6b4200;letter-spacing:.4px;text-shadow:0 1px 0 rgba(255,255,255,.4)}
.menuTitle{font-size:24px;font-weight:1000;color:#215fd0;margin:0 0 10px;text-align:center}
.levelGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px} .levelCell{background:linear-gradient(180deg,#fff,#eef5ff);border-radius:18px;box-shadow:var(--soft);height:62px;display:flex;align-items:center;justify-content:center;position:relative;font-size:22px;font-weight:1000;color:#2c71d6} .levelCell.locked{opacity:.38} .levelCell.current{outline:3px solid #ffbf22;background:linear-gradient(180deg,#fff8d8,#ffefac)} .miniStars{position:absolute;left:0;right:0;bottom:5px;font-size:9px;color:#efad13;letter-spacing:-1px;text-align:center}
.garageList{display:grid;gap:10px} .pack{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;box-shadow:var(--soft);padding:12px} .pack.active{outline:3px solid #ffbf22} .packName{font-weight:1000;color:#215fd0} .packPreview{display:flex;gap:6px;align-items:center} .packPreview img{width:42px;height:42px;object-fit:contain}
.toast{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:200;padding:10px 14px;background:#fff;border-radius:16px;box-shadow:var(--shadow);font-weight:900;color:#276d37;opacity:0;pointer-events:none;transition:.22s} .toast.show{opacity:1} .toast.bad{color:#cb4a44}
.confetti{position:absolute;z-index:160;width:8px;height:14px;border-radius:3px;top:-16px;animation:fall 1.6s linear forwards} @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(620deg);opacity:.92}}
@media (max-height: 780px){ .top{grid-template-columns:60px 1fr 120px;gap:8px} .btnMenu{width:60px} .btnGarage{width:114px} .coinIcon{width:34px} .coins{font-size:18px;min-width:48px} .logo{max-width:280px} .world{width:min(96vw,460px)} .lotShell{left:62px;right:64px;top:94px;bottom:150px} .exitSign{top:235px;width:82px} .metrics{gap:8px} .metric .num{font-size:34px;bottom:18px} .bubbleTut{width:190px;top:110px} .shop{width:74px} .parkB{width:96px} .hotdog{width:68px} .fountain{width:80px} .tree1{width:64px} .tree2{width:58px} .tree3{width:54px} }
</style>
</head>

<div class="app" id="app">
  <svg class="bgCloud c1" width="100" height="50" viewBox="0 0 100 50"><path fill="white" d="M20 38h54c13 0 21-8 21-18s-8-18-19-18c-2 0-3 0-5 1C67-4 55-1 50 7 45 2 38 0 31 0 18 0 8 9 8 20v1C3 24 0 29 0 34c0 8 7 14 20 14z"/></svg>
  <svg class="bgCloud c2" width="120" height="56" viewBox="0 0 120 56"><path fill="white" d="M22 42h68c16 0 26-9 26-20S106 2 92 2c-2 0-5 .2-7 1C80-1 71 0 64 6 58 1 49 0 42 0 24 0 10 12 10 27v1C4 31 0 36 0 41c0 9 7 15 22 15z"/></svg>

  <div class="top">

    <div class="lotShell"><div class="lot" id="lot"></div></div>
    <img class="exitSign" src="assets/sign_exit.png" alt="exit">
    <img class="bubbleTut" id="tutorial" src="assets/bubble_tutorial.png" alt="tap a car">
    <img class="blockedPop" id="blockedPop" src="assets/bubble_blocked.png" alt="blocked">

    <div class="metrics">
      <div class="metric errors"><img src="assets/card_errors.png" alt="errors"><div class="num" id="faults">0</div></div>

      <div class="metric combo"><img src="assets/card_combo.png" alt="combo"><div class="num" id="combo">x0</div></div>
    </div>
  </div>

  <div class="bottom">
    <div class="controls">
      <button class="ctrl" id="undoBtn"><img src="assets/btn_undo.png" alt="undo"></button>
      <button class="ctrl" id="hintBtn"><img src="assets/btn_hint.png" alt="hint"><img class="hintBadge" src="assets/badge_3.png" alt="3"></button>
      <button class="ctrl" id="restartBtn"><img src="assets/btn_restart.png" alt="restart"></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="winOverlay">
    <div class="panel">
      <div class="winTop">
        <img class="medal" src="assets/medal.png" alt="medal">
        <div class="menuTitle">Level Complete!</div>
        <div class="stars" id="winStars">⭐⭐⭐</div>
        <div class="winText" id="winText"></div>
      </div>
      <div class="winBtns">
        <button class="bigSprite" id="nextBtn"><img src="assets/btn_next.png" alt="next"></button>
        <button class="bigSprite" id="replayBtn"><img src="assets/btn_replay.png" alt="replay"></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="menuOverlay">
    <div class="panel">
      <button class="close" data-close="menuOverlay">✕</button>
      <div class="menuTitle">Levels</div>
      <div class="levelGrid" id="levelGrid"></div>
    </div>
  </div>

  <div class="overlay" id="garageOverlay">
    <div class="panel">
      <button class="close" data-close="garageOverlay">✕</button>
      <div class="menuTitle">Garage</div>
      <div class="garageList" id="garageList"></div>
    </div>
  </div>
</div>

const SMALL_CARS=['assets/car_purple1.png','assets/car_yellow.png','assets/car_red.png','assets/car_blue.png','assets/car_green_suv.png','assets/car_pink.png','assets/car_lime_suv.png','assets/car_purple2.png'];

const PACKS=[
  {id:'party',name:'Party Mix', small:[0,1,2,3,5,7], bus:[0,3]},

function sfx(type){
  try{
    audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); const now=audioCtx.currentTime;
    if(type==='go'){o.frequency.setValueAtTime(250,now); o.frequency.exponentialRampToValueAtTime(430,now+.13); g.gain.setValueAtTime(.05,now); g.gain.exponentialRampToValueAtTime(.001,now+.16)}
    if(type==='bad'){o.type='square'; o.frequency.setValueAtTime(125,now); o.frequency.linearRampToValueAtTime(82,now+.13); g.gain.setValueAtTime(.04,now); g.gain.exponentialRampToValueAtTime(.001,now+.16)}
    if(type==='win'){o.frequency.setValueAtTime(460,now); o.frequency.setValueAtTime(660,now+.08); o.frequency.setValueAtTime(920,now+.18); g.gain.setValueAtTime(.05,now); g.gain.exponentialRampToValueAtTime(.001,now+.36)}
    o.start(now); o.stop(now+.4);
  }catch(e){}
}

function currentPack(){ return PACKS.find(p=>p.id===packId) || PACKS[0]; }
function getSmallSprite(i){ const p=currentPack(); return SMALL_CARS[p.small[i % p.small.length]]; }
function getBusSprite(i){ const p=currentPack(); return BUSES[p.bus[i % p.bus.length]]; }
function saveState(){ Object.assign(localStorage, {pp_level: levelIndex, pp_maxLevel: maxLevel, pp_coins: coins, pp_stars: JSON.stringify(best), pp_pack: packId}); }

function buildGrid(){
  lot.innerHTML='';
  for(let i=1;i<COLS;i++){ const d=document.createElement('div'); d.className='gridline v'; d.style.left=(i/COLS*100)+'%'; lot.appendChild(d); }
  for(let i=1;i<ROWS;i++){ const d=document.createElement('div'); d.className='gridline h'; d.style.top=(i/ROWS*100)+'%'; lot.appendChild(d); }
}
function rotationFor(car){
  if(car.o==='v') return car.dir===1 ? 180 : 0;
  return car.dir===1 ? 90 : -90;
}
function loadLevel(idx){
  busy=false; history=[]; faults=0; combo=0; usedHint=false;
  $('winOverlay').classList.remove('show');
  levelIndex=Math.max(0, Math.min(idx, LEVELS.length-1));
  buildGrid();
  cars = LEVELS[levelIndex].map((c,i)=>({...c,id:i,alive:true,sprite:(c.type==='bus'?getBusSprite(i):getSmallSprite(i))}));
  startCount=cars.length;
  render();
  $('levelTitle').textContent='Level '+(levelIndex+1);
  $('levelSub').textContent=levelIndex<8 ? 'Clear the parking lot' : levelIndex<14 ? 'Traffic is getting tight' : 'Rush hour challenge';
  $('tutorial').style.display=(levelIndex===0 && !localStorage.pp_tutorial) ? 'block' : 'none';
  saveState();
}
function render(){
  cars.forEach(car=>{
    let el=$('car'+car.id);
    if(!car.alive){ if(el) el.remove(); return; }
    if(!el){
      el=document.createElement('button'); el.id='car'+car.id; el.className='car';
      const img=document.createElement('img'); img.src=car.sprite; el.appendChild(img); el.onclick=()=>tapCar(car.id);
      lot.appendChild(el);
    }
    el.style.left=(car.x/COLS*100+1)+'%';
    el.style.top=(car.y/ROWS*100+1)+'%';
    el.style.width=(car.w/COLS*100-2)+'%';
    el.style.height=(car.h/ROWS*100-2)+'%';
    el.style.transform='rotate('+rotationFor(car)+'deg)';
    el.firstChild.src = car.sprite;
  });
  $('coins').textContent=coins.toLocaleString('en-US');
  $('faults').textContent=faults;
  $('left').textContent=cars.filter(c=>c.alive).length;
  $('combo').textContent='x'+combo;
}
function occupancy(exceptId){
  let occ=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  cars.filter(c=>c.alive && c.id!==exceptId).forEach(c=>{ for(let y=c.y;y<c.y+c.h;y++) for(let x=c.x;x<c.x+c.w;x++) occ[y][x]=c.id; });
  return occ;
}
function clearPath(car){
  const occ=occupancy(car.id);
  if(car.o==='v'){
    const ys = car.dir===1 ? [...Array(ROWS-(car.y+car.h)).keys()].map(i=>car.y+car.h+i) : [...Array(car.y).keys()].map(i=>car.y-1-i);
    return ys.every(y => [...Array(car.w).keys()].every(i => occ[y][car.x+i]==null));
  } else {
    const xs = car.dir===1 ? [...Array(COLS-(car.x+car.w)).keys()].map(i=>car.x+car.w+i) : [...Array(car.x).keys()].map(i=>car.x-1-i);
    return xs.every(x => [...Array(car.h).keys()].every(i => occ[car.y+i][x]==null));
  }
}
function showToast(text,bad=false){
  const t=$('toast'); t.textContent=text; t.className='toast show'+(bad?' bad':'');
  clearTimeout(showToast._t); showToast._t=setTimeout(()=>t.className='toast'+(bad?' bad':''), 780);
}
function showBlocked(){ const b=$('blockedPop'); b.style.display='block'; clearTimeout(showBlocked._t); showBlocked._t=setTimeout(()=>b.style.display='none', 700); }
function smokeAt(car){ const s=document.createElement('div'); s.className='smoke'; s.style.left=((car.x+car.w/2)/COLS*100)+'%'; s.style.top=((car.y+car.h/2)/ROWS*100)+'%'; lot.appendChild(s); setTimeout(()=>s.remove(),720); }
function coinPop(car,n){ const p=document.createElement('div'); p.className='coinPop'; p.textContent='+'+n; p.style.left=((car.x+car.w/2)/COLS*100-2)+'%'; p.style.top=((car.y+car.h/2)/ROWS*100)+'%'; lot.appendChild(p); setTimeout(()=>p.remove(),820); }
function tapCar(id){
  if(busy) return; const car=cars.find(x=>x.id===id && x.alive); if(!car) return;
  localStorage.pp_tutorial='1'; $('tutorial').style.display='none'; document.querySelectorAll('.car.hint').forEach(e=>e.classList.remove('hint'));
  if(!clearPath(car)){
    faults++; combo=0; render(); const el=$('car'+id); el.classList.remove('blocked'); void el.offsetWidth; el.classList.add('blocked'); sfx('bad'); if(navigator.vibrate) navigator.vibrate(35); showBlocked(); showToast('Blocked!', true); return;
  }
  history.push(id); busy=true; combo++; sfx('go'); smokeAt(car); if(combo>1) coinPop(car, Math.min(combo,5));
  const el=$('car'+id); const base='rotate('+rotationFor(car)+'deg) ';
  if(car.o==='v') el.style.transform=base+'translateY('+(car.dir===1? '140%':'-140%')+')'; else el.style.transform=base+'translateX('+(car.dir===1? '140%':'-140%')+')';
  el.style.opacity='0';
  setTimeout(()=>{ car.alive=false; busy=false; render(); if(cars.every(x=>!x.alive)) setTimeout(victory, 220); }, 440);
}
function starsEarned(){ if(faults===0 && !usedHint) return 3; if(faults<=2) return 2; return 1; }
function victory(){
  const stars=starsEarned(), prev=Number(best[levelIndex]||0); best[levelIndex]=Math.max(prev, stars);
  let reward=10; if(prev===0) reward=35+stars*10; else if(stars>prev) reward=20+(stars-prev)*10;
  coins += reward; maxLevel=Math.max(maxLevel, Math.min(levelIndex+1, LEVELS.length-1)); saveState();
  $('coins').textContent=coins.toLocaleString('en-US');
  $('winStars').innerHTML=[1,2,3].map(i=>'<span class="'+(i<=stars?'':'starOff')+'">⭐</span>').join('');
  $('winText').innerHTML='Errors: <b>'+faults+'</b> · Reward: <b>+'+reward+' coins</b>';
  $('winOverlay').classList.add('show'); sfx('win'); confetti(); if(navigator.vibrate) navigator.vibrate([24,42,60]);
}
function undo(){ if(busy || !history.length){ showToast('Nothing to undo', true); return; } const id=history.pop(), car=cars.find(x=>x.id===id); car.alive=true; combo=0; render(); showToast('Move undone'); }
function hint(){ document.querySelectorAll('.car.hint').forEach(e=>e.classList.remove('hint')); const car=cars.find(c=>c.alive && clearPath(c)); if(!car){ showToast('Try Undo', true); return; } usedHint=true; faults++; render(); $('car'+car.id).classList.add('hint'); showToast('Try this car'); }
function confetti(){ const app=$('app'), cs=['#ffd24c','#ef6962','#4aa6e8','#66c38a','#a879e5','#ff8b2b']; for(let i=0;i<34;i++){ let d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'%'; d.style.background=cs[i%cs.length]; d.style.setProperty('--dx',(Math.random()*130-65)+'px'); d.style.animationDelay=(Math.random()*.24)+'s'; app.appendChild(d); setTimeout(()=>d.remove(),1900); } }

function openOverlay(id){ $(id).classList.add('show'); } function closeOverlay(id){ $(id).classList.remove('show'); }
function renderLevelGrid(){ const g=$('levelGrid'); g.innerHTML=''; LEVELS.forEach((_,i)=>{ const b=document.createElement('button'); const locked=i>maxLevel; b.className='levelCell'+(locked?' locked':'')+(i===levelIndex?' current':''); b.disabled=locked; b.innerHTML=(locked?'🔒':(i+1))+'<div class="miniStars">'+('★'.repeat(Number(best[i]||0)))+'</div>'; b.onclick=()=>{ closeOverlay('menuOverlay'); loadLevel(i); }; g.appendChild(b); }); }
function renderGarage(){ const list=$('garageList'); list.innerHTML=''; PACKS.forEach(pack=>{ const row=document.createElement('button'); row.className='pack'+(pack.id===packId?' active':''); row.innerHTML='<div><div class="packName">'+pack.name+'</div><div style="color:#5c7faa;font-weight:800;font-size:13px;margin-top:3px">Choose your vehicle style</div></div><div class="packPreview"><img src="'+SMALL_CARS[pack.small[0]]+'"><img src="'+SMALL_CARS[pack.small[1]]+'"><img src="'+BUSES[pack.bus[0]]+'"></div>'; row.onclick=()=>{ packId=pack.id; saveState(); closeOverlay('garageOverlay'); loadLevel(levelIndex); showToast('Garage updated'); }; list.appendChild(row); }); }

document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeOverlay(b.dataset.close));
$('menuBtn').onclick=()=>{ renderLevelGrid(); openOverlay('menuOverlay'); };
$('garageBtn').onclick=()=>{ renderGarage(); openOverlay('garageOverlay'); };
$('undoBtn').onclick=undo; $('hintBtn').onclick=hint; $('restartBtn').onclick=()=>loadLevel(levelIndex);
$('replayBtn').onclick=()=>loadLevel(levelIndex); $('nextBtn').onclick=()=>{ if(levelIndex===LEVELS.length-1){ closeOverlay('winOverlay'); renderLevelGrid(); openOverlay('menuOverlay'); } else loadLevel(levelIndex+1); };
loadLevel(levelIndex);
</script>
</body>
</html>
